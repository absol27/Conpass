# The platform routes https://conpass.cnh.radarhq.io to Service `app`, port 80.
# Keep this name and port; change only the selector when the entrypoint moves.
apiVersion: v1
kind: Service
metadata:
  name: app
  labels:
    app: app
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
