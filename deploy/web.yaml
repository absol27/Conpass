apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  # Remove this line when you turn on the HPA (examples/hpa), or Argo CD and
  # the autoscaler will keep resetting each other.
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: web
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEAM_NAME
              value: "conpass"
            # Real walk times between rooms (GET /map/api/walk-matrix).
            - name: MAPS_URL
              value: "http://maps:8080"
            # Secret `elastic` is created by hand in the cluster, never in git.
            - name: ES_URL
              valueFrom:
                secretKeyRef:
                  name: elastic
                  key: url
            - name: ES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: elastic
                  key: api-key
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
